# Release 워크플로가 부르는 빌드 한 벌(OS 하나). 같은 단계를 GitHub 기계와 사무실 맥 스튜디오가 같이 쓰려고 떼어 냈다.
# 버전 · 서명 · 공증 설명은 release.yml 맨 위에 있다.
name: Build

on:
  workflow_call:
    inputs:
      os:
        description: "macos · windows · linux"
        type: string
        required: true
      runner:
        description: "runs-on 값을 JSON 으로 (\"macos-15\" 또는 [\"self-hosted\", …])"
        type: string
        required: true
      builder:
        description: "electron-builder 의 OS 인자 (--mac · --win · --linux)"
        type: string
        required: true
      version:
        type: string
        required: true
      sha:
        type: string
        required: true
      build_number:
        type: string
        required: true

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      VERSION: ${{ inputs.version }}
      # 파일 이름은 태그 모양을 쓴다. 지금은 앱 버전과 태그가 같다(2.6.110502). 예전 판은 앱 2.6.1031+2 · 태그 2.6.1031.2 였다 (app/builder.config.cjs)
      SPLIT_TAG: ${{ inputs.version }}
      SPLIT_BUILD_NUMBER: ${{ inputs.build_number }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/native/target.noindex
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.sha }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ inputs.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/native -> target.noindex

      - name: Install the Linux packaging tools
        if: inputs.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: pnpm install --frozen-lockfile

      # Why: on the office Mac Studio the build waits its turn behind the phone builds and Claude sessions there
      # (heavy-run runs one heavy job at a time on a Mac). GitHub's machines run only this job, so nothing waits.
      - name: Take a turn on an office Mac
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          HEAVY="$HOME/git/claude-config/bin/heavy-run"
          [ -x "$HEAVY" ] && echo "HEAVY=$HEAVY --name Split-release" >> "$GITHUB_ENV" || true

      # 맥은 Apple silicon 과 Intel 판을 한 파일(split-native.darwin-universal.node)로 합친다.
      - name: Build the native module
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.os }}" = macos ]; then ${HEAVY:-} pnpm native:mac-universal; else pnpm native; fi
          ls -la native/*.node

      - run: ${HEAVY:-} pnpm build
        shell: bash

      - name: Prepare a temporary signing keychain
        if: inputs.os == 'macos'
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SECRETS="$RUNNER_TEMP/split-secrets"
          mkdir -p "$SECRETS" && chmod 700 "$SECRETS"
          KEYCHAIN="$RUNNER_TEMP/split-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          # The search list is put back as it was when the run ends.
          security list-keychains -d user | tr -d '" ' > "$SECRETS/keychains-before"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$SECRETS/developer-id.p12"
          security import "$SECRETS/developer-id.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$SECRETS/keychains-before")
          rm "$SECRETS/developer-id.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s' "$ASC_API_KEY_P8" > "$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" > "$SECRETS/sparkle_eddsa_private.key"
          chmod 600 "$SECRETS/"*
          echo "APPLE_API_KEY_PATH=$SECRETS/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"
          echo "SPARKLE_KEY_FILE=$SECRETS/sparkle_eddsa_private.key" >> "$GITHUB_ENV"
          # Why: an office Mac may hold another copy of the same certificate; signing from this keychain only
          # keeps codesign from finding two identities with one name.
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # macOS 에서는 위 키체인의 Developer ID 로 서명하고(CSC_NAME), APPLE_API_* 로 앱을 공증한다.
      # 올리기는 publish 작업이 한꺼번에 하므로 여기서는 --publish never.
      - name: Build the app
        shell: bash
        env:
          SPLIT_RELEASE: ${{ inputs.os == 'macos' && '1' || '' }}
          CSC_NAME: ${{ inputs.os == 'macos' && 'Runners Co., Ltd (RGWVXJ8URP)' || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.os == 'macos' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ inputs.os == 'macos' && secrets.ASC_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.os == 'macos' && secrets.ASC_API_ISSUER_ID || '' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.os }}" = macos ]; then export APPLE_API_KEY="$APPLE_API_KEY_PATH"; fi
          # Why: stapling inside electron-builder fails now and then when Apple's ticket server drops the
          # connection (NSURLErrorDomain -1005, stapler error 68); a second try a little later goes through.
          for TRY in 1 2 3; do
            ${HEAVY:-} pnpm exec electron-builder --config builder.config.cjs ${{ inputs.builder }} --publish never && break
            [ "$TRY" = 3 ] && exit 1
            echo "::warning::electron-builder failed (try $TRY), trying again in 30 seconds"
            sleep 30
          done

      # 앱은 electron-builder 가 공증했지만 DMG 자체도 서명 · 공증 · 스테이플해야 오프라인에서도 경고 없이 열린다
      - name: Notarize the DMG
        if: inputs.os == 'macos'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for DMG in dist.noindex/*.dmg; do
            # electron-builder signs the app inside but not the DMG; Gatekeeper wants the DMG signed too.
            codesign --sign "Runners Co., Ltd (RGWVXJ8URP)" --keychain "$CSC_KEYCHAIN" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" --wait
            for TRY in 1 2 3; do
              xcrun stapler staple "$DMG" && break
              [ "$TRY" = 3 ] && exit 1
              echo "::warning::stapler failed (try $TRY), trying again in 30 seconds"
              sleep 30
            done
            spctl -a -t open --context context:primary-signature -v "$DMG"
          done

      # 다리: 예전 맥 판(Sparkle 2.10.1)이 읽는 appcast.xml. 같은 zip 을 Sparkle 열쇠(EdDSA)로 서명해 적는다.
      # 예전 맥 판이 하나도 남지 않으면 이 단계를 지워도 된다.
      - name: Write appcast.xml for installed copies of the previous Mac app
        if: inputs.os == 'macos'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          ZIP="dist.noindex/Split-$VERSION-mac.zip"
          SIGNED=$("$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file "$SPARKLE_KEY_FILE" "$ZIP")
          cat > dist.noindex/appcast.xml <<EOF
          <?xml version="1.0" standalone="yes"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
              <channel>
                  <title>Split</title>
                  <item>
                      <title>$VERSION</title>
                      <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                      <sparkle:version>$SPLIT_BUILD_NUMBER</sparkle:version>
                      <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                      <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                      <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Split-$VERSION-mac.zip" type="application/octet-stream" $SIGNED/>
                  </item>
              </channel>
          </rss>
          EOF
          xmllint --noout dist.noindex/appcast.xml
          cat dist.noindex/appcast.xml

      - name: Collect the files
        shell: bash
        run: |
          set -euo pipefail
          OUT=dist-release && mkdir -p $OUT
          shopt -s nullglob
          for f in dist.noindex/*.{dmg,zip,exe,AppImage,deb,rpm,blockmap,yml,xml}; do
            case "$(basename "$f")" in builder-debug.yml|builder-effective-config.yaml) continue ;; esac
            cp "$f" "$OUT/"
          done
          # 홈페이지의 받기 단추는 releases/latest/download/<이름> 으로 바로 받는다. 그래서 버전 없는 이름으로도
          # 한 벌 올린다. 자동 업데이트(latest*.yml)와 Homebrew 는 버전 붙은 파일을 쓴다.
          case "${{ inputs.os }}" in
            macos) cp "dist.noindex/Split-$VERSION.dmg" "$OUT/split-macos.dmg" ;;
            windows) cp "dist.noindex/Split-$VERSION-windows-x64-setup.exe" "$OUT/split-windows-x64-setup.exe" ;;
            linux) cp "dist.noindex/Split-$VERSION-linux-x86_64.AppImage" "$OUT/split-linux-x86_64.AppImage"
                   cp "dist.noindex/Split-$VERSION-linux-amd64.deb" "$OUT/split-linux-amd64.deb" ;;
          esac
          ls -la $OUT

      - uses: actions/upload-artifact@v4
        with:
          name: split-${{ inputs.os }}
          # Why: the Mac Studio build after a GitHub Mac build that failed late replaces that build's files.
          overwrite: true
          path: app/dist-release/*
          retention-days: 3

      - name: Remove the temporary keychain and keys
        if: always() && inputs.os == 'macos'
        run: |
          SECRETS="$RUNNER_TEMP/split-secrets"
          if [ -f "$SECRETS/keychains-before" ]; then
            security list-keychains -d user -s $(cat "$SECRETS/keychains-before")
          fi
          security delete-keychain "$RUNNER_TEMP/split-signing.keychain-db" 2>/dev/null || true
          rm -rf "$SECRETS"
          # Why: on an office Mac the machine stays after the job. Fail the run when the signing key is still
          # reachable there, so a leftover certificate shows up instead of staying on that Mac.
          if [ -e "$RUNNER_TEMP/split-signing.keychain-db" ] || security list-keychains -d user | grep -q split-signing; then
            echo "::error::The signing keychain is still on this machine"; exit 1
          fi
          echo "Keychains left on this machine:"; security list-keychains -d user

