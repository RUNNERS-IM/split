# master 를 release 브랜치로 합치면 배포 판을 낸다(태그 v<버전>). 센스 · 푸딩 · Monitor 와 같은 방식:
# 1) 버전을 출시일 기준 2.{연도 끝자리}.{MMDD} 로 올려 release 에 커밋한다([skip ci]),
# 2) 네이티브 모듈(app/native/, napi-rs)을 OS 마다 빌드하고 electron-builder 로 macOS(유니버설) · 윈도우 · 리눅스
#    판을 만들어 GitHub Releases(태그 v<버전>)에 올린다. electron-updater 가 읽는 latest-mac.yml · latest.yml ·
#    latest-linux.yml 도 같이 올린다.
# 3) 예전 맥 판(Objective-C, Sparkle)이 읽는 appcast.xml 도 같이 올린다. 그 판은 runners.im/split/appcast.xml →
#    releases/latest/download/appcast.xml 을 읽고 이 판의 zip 을 받아 스스로 바꿔 끼운다.
# Homebrew 는 RUNNERS-IM/homebrew-tap 의 워크플로가 최신 릴리스를 보고 따라 고친다.
#
# 빌드 단계는 build.yml 에 있다. Mac 판은 GitHub Mac(macos-15)에서 먼저 만들고, 그 작업이 취소 · 실패하면
# 사무실 맥 스튜디오(m2-ultra-sun-1)가 같은 출시 안에서 이어서 만든다. publish 는 성공한 쪽 Mac 판을 올린다.
#
# macOS 는 Developer ID 로 서명 · 공증한다. 서명 키는 저장소 비밀값에서 이 실행 동안만 쓰는 임시 키체인에 넣고
# 끝나면 지운다. 윈도우는 코드 서명 인증서가 없어 서명하지 않는다(처음 열 때 SmartScreen 경고가 뜬다).
# App Store 판은 Electron mas 판으로 scripts/release-app-store.sh 를 돌려 사람이 올린다(TestFlight 까지).
#
# 손으로 돌릴 때(workflow_dispatch) publish 를 끄면 버전을 올리지 않고 빌드 · 서명 · 공증까지만 해서
# 결과를 실행 기록 첨부로만 남긴다. 아무에게도 배포되지 않으니 빌드 시험에 쓴다.
name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: "버전을 올리고 배포하기 (끄면 시험 실행)"
        type: boolean
        default: false
      skip_github_mac:
        description: "GitHub Mac 작업을 건너뛰어 맥 스튜디오 대체 경로를 시험하기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 시험 실행(손으로 돌리고 publish 끔)은 아무것도 올리지 않아 출시 줄에 세우지 않는다. 서명 잠금 시험처럼 겹쳐 돌릴 수 있다.
  group: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && format('split-test-{0}', github.run_id) || 'split-release' }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}

jobs:
  version:
    # 버전 올림 커밋이 다시 이 워크플로를 부르지 않게 막는다
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      sha: ${{ steps.bump.outputs.sha || github.sha }}
      build_number: ${{ steps.count.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.PUBLISH == 'true' && 'release' || github.ref }}
          fetch-depth: 0  # 태그로 같은 날 낸 버전이 있는지 보고, 커밋 수로 빌드 번호를 정한다

      - name: Bump the version and push
        id: bump
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          BUMPED=$(scripts/bump-release.sh)
          VERSION=$(echo "$BUMPED" | sed -n 1p)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/native/Cargo.toml
          # 멈춘 배포를 다시 돌리면 버전이 이미 올라가 있다. 바뀐 게 없으면 커밋을 건너뛴다.
          git diff --cached --quiet || git commit -q -m "Split $VERSION [skip ci]"
          git push origin HEAD:release
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pick the version of a test run
        id: current
        if: env.PUBLISH != 'true'
        run: echo "version=$(jq -r .version app/package.json | tr + .)-test" >> "$GITHUB_OUTPUT"

      # 예전 맥 판의 Sparkle 은 CFBundleVersion(커밋 수, 2.6.1030.10 은 789)을 비교한다. 더 작으면 업데이트로 안 보인다.
      - name: Count the build number
        id: count
        run: |
          set -euo pipefail
          COUNT=$(git rev-list --count HEAD)
          [ "$COUNT" -gt 789 ] || { echo "빌드 번호 $COUNT 이 예전 맥 판(789)보다 크지 않습니다." >&2; exit 1; }
          echo "build_number=$COUNT" >> "$GITHUB_OUTPUT"

  # Windows · Linux 판. Mac 판은 아래 두 작업이 맡는다.
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: '"windows-latest"'
            builder: --win
          - os: linux
            runner: '"ubuntu-22.04"'  # 오래된 glibc 로 빌드해야 더 많은 배포판에서 켜진다
            builder: --linux
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      runner: ${{ matrix.runner }}
      builder: ${{ matrix.builder }}
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}
      build_number: ${{ needs.version.outputs.build_number }}

  # Mac 판은 먼저 GitHub 의 Apple 칩 Mac(macos-15)에서 만든다. GitHub 호스팅 macos-26 은 2026-10-31 새벽 대기열에서
  # 16분 만에 두 번 취소돼서 자리가 많은 macos-15 를 쓴다. 그래도 2026-11-12 새벽 자리가 없어 네 번 취소됐다.
  build-mac:
    needs: version
    if: ${{ !inputs.skip_github_mac }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos
      runner: '"macos-15"'
      builder: --mac
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}
      build_number: ${{ needs.version.outputs.build_number }}

  # GitHub Mac 작업이 취소 · 실패하면(시험에서 건너뛰어도) 같은 출시 안에서 사무실 맥 스튜디오가 이어서 만든다
  # (2026-11-12 결정 「Mac 판은 GitHub 기계 먼저, 못 받으면 맥 스튜디오에서」). 서명 키체인은 끝나면 지우고,
  # 남아 있으면 이 작업을 실패로 끝낸다(build.yml 맨 끝 단계).
  build-mac-studio:
    needs: [version, build-mac]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.build-mac.result != 'success' }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: macos
      runner: '["self-hosted", "macOS", "ARM64", "m2-ultra-sun-1"]'
      builder: --mac
      version: ${{ needs.version.outputs.version }}
      sha: ${{ needs.version.outputs.sha }}
      build_number: ${{ needs.version.outputs.build_number }}

  publish:
    needs: [version, build, build-mac, build-mac-studio]
    # 둘 중 성공한 Mac 판으로 올린다. 맥 스튜디오 작업은 GitHub Mac 이 성공하면 건너뛰어진다.
    if: >-
      !cancelled() && needs.version.result == 'success' && needs.build.result == 'success' &&
      (needs.build-mac.result == 'success' || needs.build-mac-studio.result == 'success') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      # 릴리스 본문은 저장소의 RELEASE_NOTES.md("## 한국어" · "## English" 두 칸의 "- " 목록)다. 앱의 업데이트 창이
      # 이 본문에서 자기 언어 칸의 목록만 읽어 "바뀐 점"으로 보여 준다. 설치 안내는 그 뒤 다른 칸에 붙여서 목록에
      # 섞이지 않게 한다.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: repo
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          {
            cat repo/RELEASE_NOTES.md
            printf '\n## Downloads\n\nmacOS (Apple silicon, Intel), Windows, Linux (X11). The Windows installer is not code signed yet, so Windows shows a SmartScreen warning the first time.\n'
          } > body.md
          ls -la files
          gh release create "v$VERSION" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.version.outputs.sha }}" \
            --title "Split $VERSION" \
            --notes-file body.md \
            --latest
