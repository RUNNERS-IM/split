# 커밋·PR 마다 테스트만 돈다. 사무실 맥(셀프 호스티드)은 쓰지 않는다:
# 공개 저장소라 남이 올린 PR 코드가 사무실 맥에서 실행되면 안 되기 때문.
# 작업 가지는 PR 에서 한 번만 돈다. push 는 master · release 만 본다(같은 커밋을 두 번 돌리지 않게).
name: Test

on:
  push:
    branches: [master, release]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 내보내는 판(app/, Electron): 형식 검사와 창 위치 계산 시험. 네이티브 모듈 없이 돌아 리눅스로 충분하다.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
